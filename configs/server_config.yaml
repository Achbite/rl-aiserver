# ============================================================================
# AIServer 默认运行配置
# Config 提供完整默认值；白名单环境变量和 CLI 只能覆盖已有字段。
# ============================================================================

# --- 服务参数：启动模式在这里配置，CLI --workload 可显式覆盖 ---
server:
  run_mode: "evaluation"          # exact values: training | evaluation
  listen_port: 9002               # gRPC 监听端口，Client 通过此端口连接
  max_agents: 10                  # 最大支持的 Agent 数量

policy:
  training_temperature: 1.0       # stochastic policy temperature, finite and >0
  sampling_seed: 0               # behavior-policy RNG seed, integer >=0
  action_mask_mode: "disabled"   # disabled | required; mask is opt-in

rollout:
  gamma: 0.99
  gae_lambda: 0.95
  tmax: 128

observation:
  ray_max_range: 10              # local ray maximum, grid cells, >0

# Reward 公式与数值由 src/ai/maze_reward.cpp 持有。

# --- 网格参数（A* 测试 + 训练共用）---
strategy:
  grid_size: 500                  # 网格大小 (cm)，将连续坐标离散化为网格
  replan_interval: 10             # A* 模式下重新规划路径的帧间隔（0=仅初始规划一次）

# --- 模型参数 ---
model:
  evaluation_model_path: "../models/eval/0000000/SaveModel.onnx"
  local_train_dir: "../models/train"
  startup_timeout_ms: 30000
  expected_obs_dim: 17
  expected_action_dim: 9

# --- Environment 运行 assignment（实际 Agent 数唯一权威）---
environment:
  agent_count: 4

# --- Maze 任务语义（Client 只能执行，不能覆盖）---
task:
  fixed_map_id: "maze_117436372"
  episode_max_steps: 1504

# --- 训练模型分发参数（仅 training 生效）---
model_distribution:
  host: "maze-learner"
  port: 9200
  poll_interval_ms: 200
  rpc_timeout_ms: 5000

# --- AIServer 内置异步样本分发器（仅 training 生效）---
# 它只负责本地有界队列和向 Learner Pod Sample Pool ingress 异步发送；
# Learner 消费速度不参与这里的 Client 流控判断。
sample_distributor:
  enabled: true
  host: "maze-learner"
  port: 9100
  envelope_max_transitions: 128
  envelope_max_bytes: 8388608
  rpc_timeout_ms: 2000
  max_attempts: 4
  enqueue_timeout_ms: 100
  drain_timeout_ms: 10000
  health_timeout_ms: 5000
  status_poll_interval_ms: 200
  # SamplePool ingress 不可达时，SampleDistributor 允许恢复的最长时间。
  recovery_timeout_ms: 30000
  outbound_max_envelopes: 64
  outbound_max_estimated_bytes: 67108864
  aiserver_id: "aiserver-0"
  env_id: "env-0"
