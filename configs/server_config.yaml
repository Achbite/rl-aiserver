# ============================================================================
# AIServer 配置文件 - 迷宫训练框架
# 说明：AI 决策服务的运行参数、策略参数、网络参数集中管理
#       修改后无需重新编译，重启 AIServer 即可生效
# ============================================================================

# --- 服务参数（gRPC 服务端配置）---
server:
  listen_port: 9002               # gRPC 监听端口，Client 通过此端口连接
  max_agents: 10                  # 最大支持的 Agent 数量
  run_mode: 2                     # 1=training, 2=local-test, 3=model-evaluation, 4=A*测试

# --- 网格参数（A* 测试 + 训练共用）---
strategy:
  grid_size: 500                  # 网格大小 (cm)，将连续坐标离散化为网格
  replan_interval: 10             # A* 模式下重新规划路径的帧间隔（0=仅初始规划一次）

# --- 模型参数 ---
model:
  evaluation_dir: "models/local"  # model-evaluation 从此目录读取 SaveModel.onnx
  local_train_dir: "models/local-train"  # training 下载、切换模型的运行目录
  local_test_dir: "/opt/rl/aiserver/models/local-test"  # local-test 内置模型目录，需包含 manifest.json
  manifest_name: "manifest.json"
  startup_timeout_ms: 30000
  expected_obs_dim: 13
  expected_action_dim: 9

# --- 训练模型分发参数（仅 training 生效）---
model_distribution:
  host: "maze-learner"
  port: 9200
  poll_interval_ms: 200
  boundary_wait_ms: 1000
  rpc_timeout_ms: 5000
  contract_version: "0.6.0"

# --- 样本输出参数（仅 training 生效，AIServer → LocalSampleService）---
sample_output:
  enabled: true
  host: "maze-learner"
  port: 9100
  fragment_samples: 128
  rpc_timeout_ms: 2000
  max_attempts: 4
  enqueue_timeout_ms: 100
  drain_timeout_ms: 10000
  health_timeout_ms: 5000
  outbound_max_fragments: 64
  outbound_max_estimated_bytes: 67108864
  aiserver_id: "aiserver-0"
  env_id: "env-0"

metrics:
  episode_window: 100
