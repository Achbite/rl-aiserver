  training_contract_id: "maze.training.v3"
  observation_schema_id: "maze.observation.v3"
  observation_schema_version: 1
  observation_schema_digest: "7cee41136020f3ffc8c6ae799f630d55d0588c6a99ab7f717eac3b3d08aa18b4"
  action_schema_id: "maze.action.v1"
  action_schema_version: 1
  action_schema_digest: "ce84c564e128f98adcc48fd420ac0df5acea61774a25de8705b602464009cfd8"
  reward_schema_id: "maze.reward.v4"
  reward_schema_version: 1
  reward_schema_digest: "ed284084b79413473d5053b6d3f69320d2a4639c81451ba598ca45ac8ce15929"
  policy_distribution_schema_id: "categorical.logits.v1"
  model_architecture_id: "maze.mlp-17x64x64.v1"
  semantics_digest: "6cd834542f8263135b4bfd069f372ddfdb99334060d305f58b00ce56eea10b4c"

policy:
  distribution_schema_id: "categorical.logits.v1"
  training_temperature: 1.0      # categorical temperature, unitless, >0
  policy_spec_digest: "e1efb81040681fd13fdae439caab09778c8e0b0f6bba16b7808c30fbbb632617"
  sampling_seed: 0               # behavior-policy RNG seed, integer >=0

observation:
  ray_max_range: 10              # local ray maximum, grid cells, >0

reward:
  goal_reward: 10.0                       # reward; only GOAL_REACHED, >0
  timeout_penalty: -2.0                   # reward; only TIME_LIMIT, <0
  progress_budget: 1.0                    # episode reward budget; >=0
  stage_8x_first_visit_budget: 0.75       # episode reward budget; >= 4x
  stage_4x_first_visit_budget: 0.25       # episode reward budget; >= 2x
  stage_2x_first_visit_budget: 0.0        # episode reward budget; final stage =0
  wasted_action_penalty: -0.002           # reward/action; Stay or collision, <0

# AIServer 配置文件 - 迷宫训练框架
# 说明：AI 决策服务的运行参数、策略参数、网络参数集中管理
#       修改后无需重新编译，重启 AIServer 即可生效
# ============================================================================

# --- 服务参数（gRPC 服务端配置）---
server:
  listen_port: 9002               # gRPC 监听端口，Client 通过此端口连接
  max_agents: 10                  # 最大支持的 Agent 数量
  run_mode: 1                     # 1=training, 2=local-test, 3=model-evaluation, 4=map-validation

# --- 网格参数（A* 测试 + 训练共用）---
strategy:
  grid_size: 500                  # 网格大小 (cm)，将连续坐标离散化为网格
  replan_interval: 10             # A* 模式下重新规划路径的帧间隔（0=仅初始规划一次）

# --- 模型参数 ---
model:
  evaluation_dir: "models/local"  # model-evaluation 从此目录读取 SaveModel.onnx
  local_train_dir: "models/local-train"  # training 下载、切换模型的运行目录
  local_test_dir: "/opt/rl/aiserver/models/local-test"  # local-test 内置模型目录，需包含 manifest.json
  manifest_name: "manifest.json"
  startup_timeout_ms: 30000
  expected_obs_dim: 17
  expected_action_dim: 9
  model_architecture_id: "maze.mlp-17x64x64.v1"
  tensor_dtype: "float32"
  expected_model_lineage_id: "maze-fixed-map-seed-0"

# --- Maze 任务所有权（Client 只能执行，不能覆盖）---
task:
  task_contract_id: "maze.task.v3"
  task_id: "maze.fixed.single-map.v1"
  task_revision: 2
  task_config_digest: "f16411393f778b7a2ffaf688e80f138dc33bd0709f47190c3f7b0f5946178b5b"
  agent_num: 4
  fixed_map_id: "maze_117436372"
  fixed_map_checksum_sha256: "861e0bb22a8b9a2ed689527d080c65ec2c822367e985c49753e1be9cf3ca8ae9"
  action_rule_id: "maze.action.9-way.no-corner-cut.v1"
  shortest_action_steps: 188

# --- 训练模型分发参数（仅 training 生效）---
model_distribution:
  host: "maze-learner"
  port: 9200
  poll_interval_ms: 200
  rpc_timeout_ms: 5000
  contract_version: "0.10.0"

# --- 样本输出参数（仅 training 生效，AIServer → LocalSampleService）---
sample_output:
  enabled: true
  host: "maze-learner"
  port: 9100
  fragment_samples: 128
  rpc_timeout_ms: 2000
  max_attempts: 4
  enqueue_timeout_ms: 100
  drain_timeout_ms: 10000
  health_timeout_ms: 5000
  status_poll_interval_ms: 200  # 回读 Pool 处置账目，避免 stale 尾批阻塞评测排空
  outbound_max_fragments: 64
  outbound_max_estimated_bytes: 67108864
  aiserver_id: "aiserver-0"
  env_id: "env-0"

metrics:
  episode_window: 100
