syntax = "proto3";

package rl.task.maze.v1;

option cc_generic_services = false;

import "proto/common/identity.proto";
import "proto/communication/session.proto";

// The only Client <-> AIServer wire contract. The Client owns Environment
// execution; AIServer owns task, observation, reward, policy and lifecycle
// decisions. A command is identified only by Session epoch and sequence, and
// an exact retry must preserve the complete request bytes.

// One authoritative externally visible phase replaces the former task,
// Session and Episode state triplet.

enum EpisodeMode {
    EPISODE_MODE_UNSPECIFIED = 0;
    EPISODE_MODE_TRAINING = 1;
    // Evaluation is deterministic Argmax inference. It never emits training
    // samples or training metric facts.
    EPISODE_MODE_EVALUATION = 2;
}

enum WorkloadMode {
    WORKLOAD_MODE_UNSPECIFIED = 0;
    WORKLOAD_MODE_TRAINING = 1;
    WORKLOAD_MODE_EVALUATION = 2;
}

// Action numeric values are the Environment command IDs. The enum is the
// public contract between Client and AIServer; neither side needs the other
// component's source or build identity.
enum MazeAction {
    MAZE_ACTION_NOOP = 0;
    MAZE_ACTION_UP = 1;
    MAZE_ACTION_UP_RIGHT = 2;
    MAZE_ACTION_RIGHT = 3;
    MAZE_ACTION_DOWN_RIGHT = 4;
    MAZE_ACTION_DOWN = 5;
    MAZE_ACTION_DOWN_LEFT = 6;
    MAZE_ACTION_LEFT = 7;
    MAZE_ACTION_UP_LEFT = 8;
}

enum ActionMaskMode {
    ACTION_MASK_MODE_UNSPECIFIED = 0;
    ACTION_MASK_MODE_DISABLED = 1;
    ACTION_MASK_MODE_REQUIRED = 2;
}

enum MazeTerminationReason {
    MAZE_TERMINATION_REASON_UNSPECIFIED = 0;
    MAZE_TERMINATION_REASON_ACTIVE = 1;
    MAZE_TERMINATION_REASON_GOAL_REACHED = 2;
    MAZE_TERMINATION_REASON_TIME_LIMIT = 3;
    MAZE_TERMINATION_REASON_CLIENT_ABORT = 4;
    MAZE_TERMINATION_REASON_CHAIN_FAILURE = 5;
    reserved 6;
    reserved "MAZE_TERMINATION_REASON_TASK_STOP";
}

// Runtime facts that the Environment needs in order to execute the assigned
// maze. Training schemas and policy identity deliberately do not cross this
// boundary.
message EnvironmentSpec {
    uint32 agent_count = 1;
    string map_id = 2;
    reserved 3, 4;
    reserved "expected_map_digest", "action_rule_id";
    uint32 episode_max_steps = 5;
    ActionMaskMode action_mask_mode = 6;
}

message MapDescriptor {
    string map_id = 1;
    uint32 grid_columns = 2;
    uint32 grid_rows = 3;
    uint32 grid_size_microunits = 4;
    int32 start_grid_x = 5;
    int32 start_grid_y = 6;
    int32 goal_grid_x = 7;
    int32 goal_grid_y = 8;
    bytes blocked_bitmap = 9;
    reserved 10 to 12;
    reserved "canonical_digest", "shortest_action_steps", "action_rule_id";
}

message OpenSessionReq {
    rl.common.v1.ServiceInstanceIdentity client = 1;
    string environment_instance_id = 2;
    string request_id = 3;
    reserved 4;
    reserved "task_protocol";
}

message OpenSessionRsp {
    rl.session.v1.CommandReply reply = 1;
    string session_id = 2;
    uint64 session_epoch = 3;
    rl.common.v1.ServiceInstanceIdentity aiserver = 4;
    WorkloadMode workload_mode = 5;
    EnvironmentSpec environment = 6;
    reserved 7;
    reserved "task_protocol";
}

message InitReq {
    rl.session.v1.CommandIdentity command = 1;
    MapDescriptor map = 2;
}

message InitRsp {
    rl.session.v1.CommandReply reply = 1;
    reserved 2, 3;
    reserved "accepted_map_digest", "verified_shortest_action_steps";
}

message EpisodeAssignment {
    string episode_id = 1;
    EpisodeMode mode = 2;
    uint32 max_steps = 3;
    reserved 4;
    reserved "evaluation_model_artifact_digest";
}

message TaskComplete {
    string message = 1;
}

message BeginEpisodeReq {
    rl.session.v1.CommandIdentity command = 1;
}

message BeginEpisodeRsp {
    rl.session.v1.CommandReply reply = 1;
    oneof outcome {
        EpisodeAssignment assignment = 2;
        TaskComplete task_complete = 3;
    }
}

message Vec2 {
    float x = 1;
    float y = 2;
}

message AgentState {
    uint32 agent_id = 1;
    Vec2 position = 2;
    bool is_done = 3;
    MazeTerminationReason termination_reason = 4;
    bool last_move_blocked = 5;
    optional MazeAction executed_action_id = 6;
    // When required, index N states whether MazeAction numeric value N is
    // currently executable. When disabled this field must be empty.
    repeated bool action_mask = 7;
}

message UpdateReq {
    rl.session.v1.CommandIdentity command = 1;
    uint64 frame_id = 2;
    repeated AgentState agents = 3;
}

message AgentAction {
    uint32 agent_id = 1;
    MazeAction action_id = 2;
}

message ActionBatch {
    repeated AgentAction actions = 1;
}

message WaitControl {
    int32 retry_after_ms = 1;
}

message UpdateRsp {
    rl.session.v1.CommandReply reply = 1;
    reserved 4;
    reserved "stop";
    oneof control {
        ActionBatch action_batch = 2;
        WaitControl wait = 3;
    }
}

message EndEpisodeReq {
    rl.session.v1.CommandIdentity command = 1;
}

message AgentEpisodeOutcome {
    uint32 agent_id = 1;
    MazeTerminationReason termination_reason = 2;
    uint64 terminal_frame_id = 3;
    Vec2 final_position = 4;
    optional uint32 goal_rank_group = 5;
}

message EpisodeOutcome {
    string episode_id = 1;
    repeated AgentEpisodeOutcome agents = 2;
}

message EndEpisodeRsp {
    rl.session.v1.CommandReply reply = 1;
    EpisodeOutcome outcome = 2;
}

message AbortEpisodeReq {
    rl.session.v1.CommandIdentity command = 1;
    MazeTerminationReason reason = 2;
    string message = 3;
}

message AbortEpisodeRsp {
    rl.session.v1.CommandReply reply = 1;
    // Present only when reply.result is WAIT.
    WaitControl wait = 2;
}

message CloseSessionReq {
    rl.session.v1.CommandIdentity command = 1;
}

message CloseSessionRsp {
    rl.session.v1.CommandReply reply = 1;
}

service MazeTaskService {
    rpc OpenSession(OpenSessionReq) returns (OpenSessionRsp);
    rpc Init(InitReq) returns (InitRsp);
    rpc BeginEpisode(BeginEpisodeReq) returns (BeginEpisodeRsp);
    rpc Update(UpdateReq) returns (UpdateRsp);
    rpc EndEpisode(EndEpisodeReq) returns (EndEpisodeRsp);
    rpc AbortEpisode(AbortEpisodeReq) returns (AbortEpisodeRsp);
    rpc CloseSession(CloseSessionReq) returns (CloseSessionRsp);
}
