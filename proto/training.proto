syntax = "proto3";

package rl.training.v1;

option cc_generic_services = false;

import "common.proto";

// Task-neutral sample, delivery, model and observability contracts.

enum TransitionEndKind {
    TRANSITION_END_KIND_UNSPECIFIED = 0;
    TRANSITION_END_KIND_CONTINUING = 1;
    TRANSITION_END_KIND_ENVIRONMENT_TERMINATED = 2;
    TRANSITION_END_KIND_EXTERNAL_TRUNCATION = 3;
    TRANSITION_END_KIND_PRODUCER_ABORT = 4;
}

enum PushResult {
    PUSH_RESULT_UNSPECIFIED = 0;
    PUSH_RESULT_ACCEPTED = 1;
    PUSH_RESULT_DUPLICATE = 2;
    PUSH_RESULT_REJECTED_CAPACITY = 3;
    PUSH_RESULT_REJECTED_INVALID = 4;
    PUSH_RESULT_REJECTED_IDENTITY = 5;
}

enum SampleDemandResult {
    SAMPLE_DEMAND_RESULT_UNSPECIFIED = 0;
    SAMPLE_DEMAND_RESULT_APPLIED = 1;
    SAMPLE_DEMAND_RESULT_ALREADY_APPLIED = 2;
    SAMPLE_DEMAND_RESULT_RELEASED = 3;
    SAMPLE_DEMAND_RESULT_NOT_FOUND = 4;
    SAMPLE_DEMAND_RESULT_REJECTED_INVALID = 5;
    SAMPLE_DEMAND_RESULT_REJECTED_IDENTITY = 6;
    SAMPLE_DEMAND_RESULT_REJECTED_STALE_EPOCH = 7;
}

enum SampleCreditResult {
    SAMPLE_CREDIT_RESULT_UNSPECIFIED = 0;
    SAMPLE_CREDIT_RESULT_GRANTED = 1;
    SAMPLE_CREDIT_RESULT_WAIT_NO_DEMAND = 2;
    SAMPLE_CREDIT_RESULT_WAIT_INFLIGHT_LIMIT = 3;
    SAMPLE_CREDIT_RESULT_WAIT_CAPACITY = 4;
    SAMPLE_CREDIT_RESULT_WAIT_DRAINING = 5;
    SAMPLE_CREDIT_RESULT_REJECTED_IDENTITY = 6;
    SAMPLE_CREDIT_RESULT_REJECTED_SEMANTICS = 7;
    SAMPLE_CREDIT_RESULT_REJECTED_FRESHNESS = 8;
    SAMPLE_CREDIT_RESULT_REJECTED_INVALID = 9;
}

enum SampleCreditState {
    SAMPLE_CREDIT_STATE_UNSPECIFIED = 0;
    SAMPLE_CREDIT_STATE_RESERVED = 1;
    SAMPLE_CREDIT_STATE_COMMITTED = 2;
    SAMPLE_CREDIT_STATE_RELEASED = 3;
    SAMPLE_CREDIT_STATE_EXPIRED = 4;
    SAMPLE_CREDIT_STATE_REVOKED = 5;
}

enum SampleCreditReleaseReason {
    SAMPLE_CREDIT_RELEASE_REASON_UNSPECIFIED = 0;
    SAMPLE_CREDIT_RELEASE_REASON_PRODUCER_ABORT = 1;
    SAMPLE_CREDIT_RELEASE_REASON_SHUTDOWN = 2;
    SAMPLE_CREDIT_RELEASE_REASON_SUPERSEDED = 3;
}

enum PressureState {
    PRESSURE_STATE_UNSPECIFIED = 0;
    PRESSURE_STATE_NORMAL = 1;
    PRESSURE_STATE_HIGH = 2;
    PRESSURE_STATE_FULL = 3;
}

enum GetBatchResult {
    GET_BATCH_RESULT_UNSPECIFIED = 0;
    GET_BATCH_RESULT_LEASED = 1;
    GET_BATCH_RESULT_TIMEOUT = 2;
    GET_BATCH_RESULT_BUSY = 3;
    GET_BATCH_RESULT_REJECTED = 4;
}

enum BatchAssemblyMode {
    BATCH_ASSEMBLY_MODE_UNSPECIFIED = 0;
    // Wait for target_samples and lease complete fragments without exceeding
    // max_samples. A delivery may contain multiple compatible behavior models.
    BATCH_ASSEMBLY_MODE_TARGET_BOUNDED = 1;
    // Lease the compatible fragments currently available. Used only for an
    // explicit shutdown drain; ordinary training must use TARGET_BOUNDED.
    BATCH_ASSEMBLY_MODE_DRAIN_AVAILABLE = 2;
}

enum DeliveryResult {
    DELIVERY_RESULT_UNSPECIFIED = 0;
    DELIVERY_RESULT_APPLIED = 1;
    DELIVERY_RESULT_ALREADY_APPLIED = 2;
    DELIVERY_RESULT_EXPIRED = 3;
    DELIVERY_RESULT_NOT_FOUND = 4;
    DELIVERY_RESULT_REJECTED = 5;
}

enum AckDisposition {
    ACK_DISPOSITION_UNSPECIFIED = 0;
    ACK_DISPOSITION_TRAINED = 1;
    ACK_DISPOSITION_STALE = 2;
    ACK_DISPOSITION_INVALID = 3;
    ACK_DISPOSITION_SHUTDOWN_UNTRAINED = 4;
}

enum AIServerState {
    AISERVER_STATE_UNSPECIFIED = 0;
    AISERVER_STATE_STARTING = 1;
    AISERVER_STATE_READY = 2;
    AISERVER_STATE_DEGRADED = 3;
    AISERVER_STATE_DRAINING = 4;
    AISERVER_STATE_STOPPED = 5;
}

enum ModelState {
    MODEL_STATE_UNSPECIFIED = 0;
    MODEL_STATE_WAITING = 1;
    MODEL_STATE_READY = 2;
    MODEL_STATE_FAILED = 3;
}

enum ModelRegisterResult {
    MODEL_REGISTER_RESULT_UNSPECIFIED = 0;
    MODEL_REGISTER_RESULT_REGISTERED = 1;
    MODEL_REGISTER_RESULT_ALREADY_REGISTERED = 2;
    MODEL_REGISTER_RESULT_REJECTED_INVALID = 3;
    MODEL_REGISTER_RESULT_REJECTED_CONFLICT = 4;
}

enum ModelLoadStatus {
    MODEL_LOAD_STATUS_UNSPECIFIED = 0;
    MODEL_LOAD_STATUS_LOADED = 1;
    MODEL_LOAD_STATUS_FAILED = 2;
}

enum ModelAckResult {
    MODEL_ACK_RESULT_UNSPECIFIED = 0;
    MODEL_ACK_RESULT_APPLIED = 1;
    MODEL_ACK_RESULT_ALREADY_APPLIED = 2;
    MODEL_ACK_RESULT_NOT_FOUND = 3;
    MODEL_ACK_RESULT_REJECTED = 4;
}

enum SampleBackendType {
    SAMPLE_BACKEND_TYPE_UNSPECIFIED = 0;
    SAMPLE_BACKEND_TYPE_LOCAL_MEMORY = 1;
}

enum MetricValueKind {
    METRIC_VALUE_KIND_UNSPECIFIED = 0;
    METRIC_VALUE_KIND_GAUGE = 1;
    METRIC_VALUE_KIND_COUNTER = 2;
    METRIC_VALUE_KIND_MEAN = 3;
    METRIC_VALUE_KIND_RATE = 4;
    METRIC_VALUE_KIND_QUANTILE = 5;
}

enum MetricAggregationKind {
    METRIC_AGGREGATION_KIND_UNSPECIFIED = 0;
    METRIC_AGGREGATION_KIND_NONE = 1;
    METRIC_AGGREGATION_KIND_SUM = 2;
    METRIC_AGGREGATION_KIND_WEIGHTED_MEAN = 3;
    METRIC_AGGREGATION_KIND_LATEST = 4;
    METRIC_AGGREGATION_KIND_NOT_MERGEABLE = 5;
}

enum MetricWindowKind {
    METRIC_WINDOW_KIND_UNSPECIFIED = 0;
    METRIC_WINDOW_KIND_INSTANT = 1;
    METRIC_WINDOW_KIND_CUMULATIVE = 2;
    METRIC_WINDOW_KIND_INTERVAL = 3;
    METRIC_WINDOW_KIND_ROLLING = 4;
}

enum MetricBatchResult {
    METRIC_BATCH_RESULT_UNSPECIFIED = 0;
    METRIC_BATCH_RESULT_DELIVERED = 1;
    METRIC_BATCH_RESULT_WAIT = 2;
    METRIC_BATCH_RESULT_FINAL = 3;
    METRIC_BATCH_RESULT_REJECTED_IDENTITY = 4;
    METRIC_BATCH_RESULT_REJECTED_CURSOR = 5;
    METRIC_BATCH_RESULT_REJECTED_INVALID = 6;
}

enum MetricBatchAckResult {
    METRIC_BATCH_ACK_RESULT_UNSPECIFIED = 0;
    METRIC_BATCH_ACK_RESULT_APPLIED = 1;
    METRIC_BATCH_ACK_RESULT_ALREADY_APPLIED = 2;
    METRIC_BATCH_ACK_RESULT_NOT_FOUND = 3;
    METRIC_BATCH_ACK_RESULT_REJECTED_IDENTITY = 4;
    METRIC_BATCH_ACK_RESULT_REJECTED_CURSOR = 5;
    METRIC_BATCH_ACK_RESULT_REJECTED_INVALID = 6;
}

message ModelIdentity {
    string model_lineage_id = 1;
    uint64 model_version = 2;
    rl.common.v1.ContentDigest artifact_digest = 3;
    rl.common.v1.ContentDigest manifest_digest = 4;
}

// Lightweight identity recorded on generated samples. Artifact and manifest
// digests remain mandatory at model distribution/load boundaries, but are not
// used to force every asynchronously produced fragment into one exact artifact
// bucket at the Sample Pool.
message BehaviorPolicyReference {
    string model_lineage_id = 1;
    uint64 model_version = 2;
    string distribution_schema_id = 3;
    rl.common.v1.ContentDigest policy_spec_digest = 4;
}

message SampleFreshnessPolicy {
    string model_lineage_id = 1;
    uint64 reference_model_version = 2;
    uint32 max_version_lag = 3;
    int64 max_sample_age_ms = 4;
    string distribution_schema_id = 5;
    rl.common.v1.ContentDigest policy_spec_digest = 6;
}

message BatchAssemblySpec {
    int32 target_samples = 1;
    int32 max_samples = 2;
    BatchAssemblyMode mode = 3;
}

message TrainingSemanticsIdentity {
    string training_contract_id = 1;
    rl.common.v1.SchemaIdentity observation_schema = 2;
    rl.common.v1.SchemaIdentity action_schema = 3;
    rl.common.v1.SchemaIdentity reward_schema = 4;
    string policy_distribution_schema_id = 5;
    string model_architecture_id = 6;
    rl.common.v1.ContentDigest semantics_digest = 7;
}

message Sample {
    repeated float observation = 1;
    repeated float next_observation = 2;
    int32 action = 3;
    float reward = 4;
    float old_log_probability = 5;
    float old_value_prediction = 6;
    bool terminated = 7;
    bool truncated = 8;
    TransitionEndKind end_kind = 9;
    uint64 action_step = 10;
}

message SampleBatch {
    string batch_id = 1;
    // SHA-256 over deterministic SampleBatch bytes with this field cleared.
    // A repeated batch_id with a different digest is an identity conflict.
    rl.common.v1.ContentDigest payload_digest = 2;
    string actor_session_id = 3;
    string trajectory_id = 4;
    uint32 actor_id = 5;
    uint32 fragment_id = 6;
    uint64 fragment_sequence = 7;
    repeated Sample samples = 8;
    bool trajectory_end = 9;
    float bootstrap_value = 10;
    bool bootstrap_valid = 11;
    BehaviorPolicyReference behavior_policy = 12;
    TrainingSemanticsIdentity training_semantics = 13;
    rl.common.v1.ServiceInstanceIdentity producer = 14;
    rl.common.v1.ContractIdentity contract = 15;
    int64 created_at_unix_ms = 16;
    uint64 first_action_step = 17;
    uint64 last_action_step = 18;
}

message SampleResponse {
    int32 ret_code = 1;
    uint64 model_version = 2;
}

// A short-lived, task-neutral declaration of the Learner's current training
// intake window. Refreshing an unchanged demand extends its expiry; changing
// immutable fields requires a strictly newer demand_epoch.
message SampleDemand {
    string demand_id = 1;
    uint64 demand_epoch = 2;
    rl.common.v1.ServiceInstanceIdentity consumer = 3;
    rl.common.v1.ContractIdentity contract = 4;
    TrainingSemanticsIdentity training_semantics = 5;
    SampleFreshnessPolicy freshness = 6;
    BatchAssemblySpec assembly = 7;
    int64 max_buffered_samples = 8;
    int64 max_buffered_fragments = 9;
    int64 max_buffered_estimated_bytes = 10;
    int64 expires_at_unix_ms = 11;
}

message UpsertSampleDemandReq {
    SampleDemand demand = 1;
}

message ReleaseSampleDemandReq {
    rl.common.v1.ServiceInstanceIdentity consumer = 1;
    rl.common.v1.ContractIdentity contract = 2;
    string demand_id = 3;
    uint64 demand_epoch = 4;
}

message GetSampleDemandStatusReq {
    rl.common.v1.ServiceInstanceIdentity requester = 1;
    string demand_id = 2;
}

message SampleDemandRsp {
    int32 ret_code = 1;
    SampleDemandResult result = 2;
    string message = 3;
    SampleDemand demand = 4;
    int64 reserved_samples = 5;
    int64 reserved_fragments = 6;
    int64 reserved_estimated_bytes = 7;
    rl.common.v1.ServiceInstanceIdentity distributor = 8;
}

message SampleDemandStatusRsp {
    int32 ret_code = 1;
    SampleDemandResult result = 2;
    string message = 3;
    bool active = 4;
    SampleDemand demand = 5;
    int64 demand_age_ms = 6;
    int64 reserved_samples = 7;
    int64 reserved_fragments = 8;
    int64 reserved_estimated_bytes = 9;
    rl.common.v1.ServiceInstanceIdentity distributor = 10;
}

// One credit reserves capacity for exactly one immutable SampleBatch. The
// payload digest and all identity fields are rechecked when the batch commits.
message AcquireSampleCreditReq {
    string request_id = 1;
    rl.common.v1.ServiceInstanceIdentity producer = 2;
    rl.common.v1.ContractIdentity contract = 3;
    string batch_id = 4;
    rl.common.v1.ContentDigest payload_digest = 5;
    BehaviorPolicyReference behavior_policy = 6;
    TrainingSemanticsIdentity training_semantics = 7;
    int64 sample_count = 8;
    int64 fragment_count = 9;
    int64 estimated_bytes = 10;
    int64 created_at_unix_ms = 11;
}

message SampleCreditGrant {
    int32 ret_code = 1;
    SampleCreditResult result = 2;
    string message = 3;
    string request_id = 4;
    string credit_id = 5;
    string demand_id = 6;
    uint64 demand_epoch = 7;
    string batch_id = 8;
    rl.common.v1.ContentDigest payload_digest = 9;
    int64 granted_samples = 10;
    int64 granted_fragments = 11;
    int64 granted_estimated_bytes = 12;
    int64 expires_at_unix_ms = 13;
    int32 retry_after_ms = 14;
    PressureState pressure_state = 15;
    rl.common.v1.ServiceInstanceIdentity distributor = 16;
    SampleCreditState state = 17;
}

message ReleaseSampleCreditReq {
    rl.common.v1.ServiceInstanceIdentity producer = 1;
    rl.common.v1.ContractIdentity contract = 2;
    string credit_id = 3;
    string batch_id = 4;
    rl.common.v1.ContentDigest payload_digest = 5;
    SampleCreditReleaseReason reason = 6;
}

message ReleaseSampleCreditRsp {
    int32 ret_code = 1;
    SampleCreditResult result = 2;
    string message = 3;
    string credit_id = 4;
    SampleCreditState state = 5;
    rl.common.v1.ServiceInstanceIdentity distributor = 6;
}

message PushSamplesReq {
    string credit_id = 1;
    SampleBatch batch = 2;
}

message PushSamplesRsp {
    int32 ret_code = 1;
    string message = 2;
    int64 accepted_samples = 3;
    int64 queue_size = 4;
    PushResult result = 5;
    string batch_id = 6;
    int64 accepted_unique_samples = 7;
    int64 resident_samples = 8;
    int64 resident_fragments = 9;
    int64 resident_estimated_bytes = 10;
    PressureState pressure_state = 11;
    rl.common.v1.ServiceInstanceIdentity distributor = 12;
}

message GetBatchReq {
    BatchAssemblySpec assembly = 1;
    int32 timeout_ms = 2;
    rl.common.v1.ServiceInstanceIdentity consumer = 3;
    int32 lease_timeout_ms = 4;
    SampleFreshnessPolicy freshness = 5;
    TrainingSemanticsIdentity required_semantics = 7;
}

message GetBatchRsp {
    int32 ret_code = 1;
    repeated SampleBatch batches = 2;
    int64 queue_size = 3;
    int64 returned_samples = 4;
    string message = 5;
    GetBatchResult result = 6;
    string delivery_id = 7;
    int64 lease_deadline_unix_ms = 8;
    int64 returned_fragments = 9;
    int64 actual_batch_size = 10;
    int64 wait_ms = 11;
    int64 leased_samples = 12;
    rl.common.v1.ServiceInstanceIdentity distributor = 13;
    uint64 minimum_behavior_model_version = 14;
    uint64 maximum_behavior_model_version = 15;
    int64 oldest_sample_created_at_unix_ms = 16;
    int64 newest_sample_created_at_unix_ms = 17;
}

message AckBatchReq {
    rl.common.v1.ServiceInstanceIdentity consumer = 1;
    string delivery_id = 2;
    AckDisposition disposition = 3;
    string train_update_id = 4;
}

message NackBatchReq {
    rl.common.v1.ServiceInstanceIdentity consumer = 1;
    string delivery_id = 2;
    string reason = 3;
}

message RenewLeaseReq {
    rl.common.v1.ServiceInstanceIdentity consumer = 1;
    string delivery_id = 2;
    int32 lease_timeout_ms = 3;
}

message DeliveryRsp {
    int32 ret_code = 1;
    DeliveryResult result = 2;
    string message = 3;
    string delivery_id = 4;
    int64 affected_samples = 5;
    int64 queue_size = 6;
    int64 lease_deadline_unix_ms = 7;
    AckDisposition disposition = 8;
    string train_update_id = 9;
}

message DistributorStatusReq {}

message BehaviorVersionQueueStatus {
    BehaviorPolicyReference behavior_policy = 1;
    int64 ready_samples = 2;
    int64 ready_fragments = 3;
    int64 leased_samples = 4;
    int64 leased_fragments = 5;
    int64 acked_samples = 6;
    int64 acked_fragments = 7;
    int64 trained_samples = 8;
    int64 stale_samples = 9;
    int64 invalid_samples = 10;
    int64 shutdown_untrained_samples = 11;
}

message DistributorStatusRsp {
    rl.common.v1.ContractIdentity contract = 1;
    rl.common.v1.ServiceInstanceIdentity distributor = 2;
    bool ready = 3;
    int64 push_attempt_count = 4;
    int64 accepted_unique_samples = 5;
    int64 accepted_unique_batches = 6;
    int64 duplicate_push_attempt_count = 7;
    int64 duplicate_sample_attempts = 8;
    int64 rejected_push_attempt_count = 9;
    int64 rejected_sample_attempts = 10;
    int64 acked_unique_samples = 11;
    int64 acked_unique_batches = 12;
    int64 ready_queue_samples = 13;
    int64 ready_queue_fragments = 14;
    int64 leased_samples = 15;
    int64 leased_fragments = 16;
    int64 resident_samples = 17;
    int64 resident_fragments = 18;
    int64 resident_estimated_bytes = 19;
    int64 capacity_samples = 20;
    int64 capacity_fragments = 21;
    int64 capacity_estimated_bytes = 22;
    PressureState pressure_state = 23;
    int64 redelivery_count = 24;
    int64 nack_count = 25;
    int64 expired_lease_count = 26;
    int64 latest_ack_at_unix_ms = 27;
    int64 target_hit_count = 28;
    int64 partial_get_count = 29;
    int64 empty_timeout_count = 30;
    string last_error = 31;
    repeated BehaviorVersionQueueStatus behavior_versions = 32;
    int64 trained_sample_count = 33;
    int64 stale_sample_count = 34;
    int64 invalid_sample_count = 35;
    int64 shutdown_untrained_sample_count = 36;
    int64 lease_renew_count = 37;
    SampleBackendType backend_type = 38;
    int32 max_concurrent_consumers = 39;
    int32 active_consumer_count = 40;
    int64 consumer_busy_count = 41;
    bool ingress_ready = 42;
    bool pool_ready = 43;
    int64 timestamp_unix_ms = 44;
    int64 oldest_ready_sample_age_ms = 45;
    uint64 minimum_ready_model_version = 46;
    uint64 maximum_ready_model_version = 47;
    int64 active_demand_count = 48;
    uint64 active_demand_epoch = 49;
    int64 active_demand_age_ms = 50;
    int64 reserved_samples = 51;
    int64 reserved_fragments = 52;
    int64 reserved_estimated_bytes = 53;
    int64 credit_request_count = 54;
    int64 credit_grant_count = 55;
    int64 credit_commit_count = 56;
    int64 credit_release_count = 57;
    int64 credit_expire_count = 58;
    int64 credit_revoke_count = 59;
    int64 credit_wait_no_demand_count = 60;
    int64 credit_wait_inflight_limit_count = 61;
    int64 credit_wait_capacity_count = 62;
    int64 credit_wait_draining_count = 63;
    int64 demand_upsert_count = 64;
    int64 demand_release_count = 65;
}

message MetricDescriptor {
    string field_id = 1;
    string label = 2;
    string group = 3;
    string dimension = 4;
    string unit = 5;
    string scope = 6;
    string statistic = 7;
    MetricValueKind value_kind = 8;
    string owner_component = 9;
    MetricAggregationKind aggregation_kind = 10;
    MetricWindowKind window_kind = 11;
    rl.common.v1.SchemaIdentity schema_identity = 12;
}

message MetricValue {
    string field_id = 1;
    double value = 2;
    double sum = 3;
    uint64 count = 4;
    double quantile = 5;
    int64 window_start_unix_ms = 6;
    int64 window_end_unix_ms = 7;
}

// Operational point-in-time status only. MetricSnapshot is not an immutable
// event source and must not be used to reconstruct historical windows.
message MetricSnapshot {
    rl.common.v1.ServiceInstanceIdentity source = 1;
    uint64 sequence = 2;
    int64 timestamp_unix_ms = 3;
    repeated MetricDescriptor descriptors = 4;
    repeated MetricValue values = 5;
}

// RawMetricSumCount is a mergeable sufficient statistic. Producers must not
// publish a precomputed mean; consumers derive it as sum / count when count is
// non-zero. field_id is governed by the MetricEvent schema identity.
message RawMetricSumCount {
    string field_id = 1;
    double sum = 2;
    uint64 count = 3;
}

message AgentEpisodeMetricFact {
    uint32 agent_id = 1;
    double episode_return = 2;
    uint64 transition_count = 3;
    bool success = 4;
    // Task-specific termination enums stay outside the task-neutral training
    // contract. This value is the canonical enum name emitted by the owner.
    string termination_reason = 5;
    uint32 shortest_action_steps = 6;
    uint64 unique_cell_count = 7;
    uint64 blocked_move_count = 8;
    uint64 attempted_move_count = 9;
    repeated RawMetricSumCount reward_components = 10;
    uint64 behavior_model_version_min = 11;
    uint64 behavior_model_version_max = 12;
    string behavior_model_lineage_id = 13;
}

// One immutable fact is emitted after a successful Environment Episode commit.
// The repeated Agent facts preserve raw per-Agent sufficient statistics and
// intentionally contain no precomputed cross-Agent mean.
message EpisodeMetricFact {
    string task_id = 1;
    string environment_instance_id = 2;
    string episode_id = 3;
    TrainingSemanticsIdentity training_semantics = 4;
    repeated AgentEpisodeMetricFact agents = 5;
}

// One immutable fact is emitted only after the Learner update transaction has
// published its model and settled its input delivery.
message TrainUpdateMetricFact {
    string train_update_id = 1;
    uint64 train_update_sequence = 2;
    ModelIdentity published_model = 3;
    string delivery_id = 4;
    TrainingSemanticsIdentity training_semantics = 5;
    int64 cumulative_trained_samples = 6;
    int64 actual_batch_size = 7;
    uint64 behavior_model_version_min = 8;
    uint64 behavior_model_version_max = 9;
    repeated RawMetricSumCount ppo_statistics = 10;
    string behavior_model_lineage_id = 11;
}

message MetricEvent {
    rl.common.v1.ContractIdentity contract = 1;
    // A3-SL uses schema_id "maze.metrics.v2", schema_version 2 and the
    // canonical digest published with schemas/maze.metrics.v2.json.
    rl.common.v1.SchemaIdentity schema_identity = 2;
    rl.common.v1.ServiceInstanceIdentity source = 3;
    // Starts at 1 for each source lifecycle. Zero is never a valid event and
    // is reserved for a consumer cursor that has acknowledged no event.
    uint64 event_sequence = 4;
    int64 committed_at_unix_ms = 5;
    oneof fact {
        EpisodeMetricFact episode = 6;
        TrainUpdateMetricFact train_update = 7;
    }
}

message MetricSequenceGap {
    // The inclusive unavailable interval. A valid gap satisfies
    // first <= last < oldest_available. It is an explicit incomplete-history
    // fact, not a heartbeat and not an empty event batch.
    uint64 first_unavailable_event_sequence = 1;
    uint64 last_unavailable_event_sequence = 2;
    uint64 oldest_available_event_sequence = 3;
    string reason = 4;
}

message MetricBatch {
    // Starts at 1 for each source lifecycle. Zero is reserved for an initial
    // consumer cursor. The contract, schema and source must exactly equal
    // those of every contained event.
    rl.common.v1.ContractIdentity contract = 1;
    rl.common.v1.SchemaIdentity schema_identity = 2;
    rl.common.v1.ServiceInstanceIdentity source = 3;
    uint64 batch_sequence = 4;
    // Computed over deterministic MetricBatch bytes with this field cleared.
    rl.common.v1.ContentDigest batch_digest = 5;
    int64 created_at_unix_ms = 6;
    // For an event batch these equal the first and last strictly increasing,
    // non-zero event sequences. For a gap batch they equal the unavailable
    // interval. For a heartbeat they are both zero.
    uint64 first_event_sequence = 7;
    uint64 last_event_sequence = 8;
    repeated MetricEvent events = 9;
    // A heartbeat has no events and no gap. It still has a non-zero batch
    // sequence and digest and must be acknowledged.
    bool heartbeat = 10;
    // May accompany the last event, gap or heartbeat batch. A source that
    // committed no events terminates with a final heartbeat whose
    // final_event_sequence is zero. Otherwise final_event_sequence equals the
    // last committed event sequence. Once that exact batch is acknowledged,
    // the producer emits no later batch in this source lifecycle and
    // GetMetricBatch returns METRIC_BATCH_RESULT_FINAL without a batch payload.
    bool source_final = 11;
    uint64 final_event_sequence = 12;
    // Monotonic event-time watermark. After this batch is acknowledged, the
    // source must never publish a later fact at or below this timestamp.
    int64 event_time_watermark_unix_ms = 13;
    MetricSequenceGap gap = 14;
}

message MetricBatchCursor {
    rl.common.v1.ServiceInstanceIdentity source = 1;
    // Both zero identify a new consumer. For events, acknowledged_event is the
    // batch last event; for a gap it is the unavailable interval last event;
    // for a heartbeat it remains the previous cursor event sequence.
    uint64 acknowledged_batch_sequence = 2;
    uint64 acknowledged_event_sequence = 3;
    rl.common.v1.ContentDigest acknowledged_batch_digest = 4;
}

message GetMetricBatchReq {
    rl.common.v1.ContractIdentity contract = 1;
    rl.common.v1.ServiceInstanceIdentity consumer = 2;
    MetricBatchCursor cursor = 3;
    uint32 max_events = 4;
    int64 max_bytes = 5;
    int32 wait_timeout_ms = 6;
}

message GetMetricBatchRsp {
    // DELIVERED always contains one batch that requires AckMetricBatch. WAIT
    // and every rejection contain no batch. FINAL contains no batch and is
    // returned only after the request cursor has acknowledged source_final.
    int32 ret_code = 1;
    MetricBatchResult result = 2;
    string message = 3;
    MetricBatch batch = 4;
    rl.common.v1.ServiceInstanceIdentity producer = 5;
    uint64 oldest_available_event_sequence = 6;
    uint64 latest_available_event_sequence = 7;
}

message AckMetricBatchReq {
    rl.common.v1.ContractIdentity contract = 1;
    rl.common.v1.ServiceInstanceIdentity consumer = 2;
    MetricBatchCursor cursor = 3;
}

message AckMetricBatchRsp {
    int32 ret_code = 1;
    MetricBatchAckResult result = 2;
    string message = 3;
    rl.common.v1.ServiceInstanceIdentity producer = 4;
    uint64 oldest_available_event_sequence = 5;
    uint64 latest_available_event_sequence = 6;
    // The durable producer-side cursor after APPLIED or ALREADY_APPLIED.
    MetricBatchCursor committed_cursor = 7;
}

message AIServerStatusReq {}

message AIServerStatusRsp {
    rl.common.v1.ContractIdentity contract = 1;
    rl.common.v1.ServiceInstanceIdentity aiserver = 2;
    AIServerState state = 3;
    bool ready = 4;
    bool distributor_ready = 5;
    ModelState model_state = 6;
    ModelIdentity loaded_model = 7;
    ModelIdentity staged_model = 8;
    int64 outbound_queue_fragments = 9;
    int64 outbound_queue_samples = 10;
    int64 outbound_queue_estimated_bytes = 11;
    int64 outbound_queue_high_watermark = 12;
    int64 produced_unique_samples = 13;
    int64 produced_unique_batches = 14;
    int64 push_attempt_count = 15;
    int64 accepted_unique_samples = 16;
    int64 duplicate_push_attempt_count = 17;
    int64 rejected_push_attempt_count = 18;
    int64 retry_attempt_count = 19;
    int64 final_drop_unique_samples = 20;
    int64 active_actor_session_count = 21;
    int64 active_trajectory_count = 22;
    int64 inference_count = 23;
    double inference_latency_sum_ms = 24;
    double inference_latency_max_ms = 25;
    int64 push_rpc_count = 26;
    double push_rpc_latency_sum_ms = 27;
    double push_rpc_latency_max_ms = 28;
    int64 model_switch_count = 29;
    int64 quarantined_sample_count = 30;
    int64 quarantined_fragment_count = 31;
    string last_error = 32;
    int64 timestamp_unix_ms = 33;
    MetricSnapshot metrics = 34;
    int64 credit_request_count = 35;
    int64 credit_grant_count = 36;
    int64 credit_wait_count = 37;
    int64 credit_reacquire_count = 38;
    int64 producer_stale_count = 39;
    int64 capacity_wait_ms = 40;
    bool training_capacity_wait = 41;
}

message ModelArtifactManifest {
    uint32 manifest_schema_version = 1;
    rl.common.v1.ContractIdentity contract = 2;
    // identity.manifest_digest is computed over deterministic manifest bytes
    // with that nested digest cleared, avoiding a self-referential hash.
    ModelIdentity identity = 3;
    rl.common.v1.SchemaIdentity observation_schema = 4;
    rl.common.v1.SchemaIdentity action_schema = 5;
    string model_architecture_id = 6;
    string tensor_dtype = 7;
    repeated int64 input_shape = 8;
    repeated int64 action_shape = 9;
    repeated int64 value_shape = 10;
    string artifact_uri = 11;
    string model_file = 12;
    int64 size_bytes = 13;
    int64 seed = 14;
    int64 train_updates = 15;
    int64 trained_samples = 16;
    rl.common.v1.ContentDigest training_config_digest = 17;
    TrainingSemanticsIdentity training_semantics = 18;
    int64 published_at_unix_ms = 19;
    bool ready = 20;
}

message RegisterModelReq {
    ModelArtifactManifest manifest = 1;
}

message RegisterModelRsp {
    int32 ret_code = 1;
    ModelRegisterResult result = 2;
    string message = 3;
    ModelArtifactManifest manifest = 4;
    rl.common.v1.ServiceInstanceIdentity distributor = 5;
}

message GetModelManifestReq {
    ModelIdentity requested_model = 1;
    rl.common.v1.ServiceInstanceIdentity requester = 2;
    bool latest_in_lineage = 3;
}

message GetModelManifestRsp {
    int32 ret_code = 1;
    string message = 2;
    ModelArtifactManifest manifest = 3;
    rl.common.v1.ServiceInstanceIdentity distributor = 4;
    // On a successful response with a manifest, both values are always valid
    // for manifest.identity lineage. The inclusive range is contiguous and
    // model version zero is valid; zero must not be interpreted as no-data.
    optional uint64 available_floor_model_version = 5;
    optional uint64 latest_available_model_version = 6;
}

message DownloadModelReq {
    ModelIdentity requested_model = 1;
    rl.common.v1.ServiceInstanceIdentity requester = 2;
}

message ModelChunk {
    ModelIdentity model = 1;
    int64 offset = 2;
    bytes data = 3;
}

message AckModelReq {
    rl.common.v1.ServiceInstanceIdentity aiserver = 1;
    ModelIdentity model = 2;
    string load_instance_id = 3;
    ModelLoadStatus load_status = 4;
    string message = 5;
}

message AckModelRsp {
    int32 ret_code = 1;
    ModelAckResult result = 2;
    string message = 3;
    rl.common.v1.ServiceInstanceIdentity distributor = 4;
}

message ModelDistributorStatusReq {}

message ModelDistributorStatusRsp {
    rl.common.v1.ContractIdentity contract = 1;
    rl.common.v1.ServiceInstanceIdentity distributor = 2;
    bool ready = 3;
    int64 registered_model_count = 4;
    ModelIdentity latest_model = 5;
    int64 register_attempt_count = 6;
    int64 duplicate_register_count = 7;
    int64 rejected_register_count = 8;
    int64 download_request_count = 9;
    int64 download_success_count = 10;
    int64 download_failure_count = 11;
    int64 bytes_served = 12;
    int64 loaded_ack_count = 13;
    int64 failed_ack_count = 14;
    rl.common.v1.ServiceInstanceIdentity latest_ack_aiserver = 15;
    ModelIdentity latest_ack_model = 16;
    ModelLoadStatus latest_ack_status = 17;
    string last_error = 18;
    int64 timestamp_unix_ms = 19;
    // Valid only when latest_model has an identity. The inclusive range is for
    // that lineage, and model version zero is a valid floor/latest value.
    optional uint64 available_floor_model_version = 20;
    optional uint64 latest_available_model_version = 21;
}

service AIServerTrainingStatusService {
    rpc GetAIServerStatus(AIServerStatusReq) returns (AIServerStatusRsp);
}

// Implemented independently by each metric-event owner (AIServer and Learner).
// A retry with the same cursor returns the same batch identity and digest until
// it is acknowledged or an explicit gap proves the requested event unavailable.
service MetricEventService {
    rpc GetMetricBatch(GetMetricBatchReq) returns (GetMetricBatchRsp);
    rpc AckMetricBatch(AckMetricBatchReq) returns (AckMetricBatchRsp);
}

service LearnerService {
    rpc SendSamples(SampleBatch) returns (SampleResponse);
}

service SampleDistributorService {
    rpc UpsertSampleDemand(UpsertSampleDemandReq) returns (SampleDemandRsp);
    rpc ReleaseSampleDemand(ReleaseSampleDemandReq) returns (SampleDemandRsp);
    rpc GetSampleDemandStatus(GetSampleDemandStatusReq)
        returns (SampleDemandStatusRsp);
    rpc AcquireSampleCredit(AcquireSampleCreditReq)
        returns (SampleCreditGrant);
    rpc ReleaseSampleCredit(ReleaseSampleCreditReq)
        returns (ReleaseSampleCreditRsp);
    rpc PushSamples(PushSamplesReq) returns (PushSamplesRsp);
    rpc GetBatch(GetBatchReq) returns (GetBatchRsp);
    rpc AckBatch(AckBatchReq) returns (DeliveryRsp);
    rpc NackBatch(NackBatchReq) returns (DeliveryRsp);
    rpc RenewLease(RenewLeaseReq) returns (DeliveryRsp);
    rpc GetStatus(DistributorStatusReq) returns (DistributorStatusRsp);
}

service ModelDistributorService {
    rpc RegisterModel(RegisterModelReq) returns (RegisterModelRsp);
    rpc GetModelManifest(GetModelManifestReq) returns (GetModelManifestRsp);
    rpc DownloadModel(DownloadModelReq) returns (stream ModelChunk);
    rpc AckModel(AckModelReq) returns (AckModelRsp);
    rpc GetModelDistributorStatus(ModelDistributorStatusReq)
        returns (ModelDistributorStatusRsp);
}
