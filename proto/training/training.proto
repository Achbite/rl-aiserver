syntax = "proto3";

package rl.training.v1;

option cc_generic_services = false;

import "proto/common/identity.proto";
import "proto/training/model_identity.proto";

// Task-neutral sample, delivery, model and observability contracts.

enum SegmentCloseReason {
    SEGMENT_CLOSE_REASON_UNSPECIFIED = 0;
    SEGMENT_CLOSE_REASON_GOAL = 1;
    SEGMENT_CLOSE_REASON_TIME_LIMIT = 2;
    SEGMENT_CLOSE_REASON_TMAX = 3;
    SEGMENT_CLOSE_REASON_CLIENT_CONTROLLED_CLOSE = 4;
    SEGMENT_CLOSE_REASON_CLIENT_RECOVERY_TIMEOUT = 5;
    SEGMENT_CLOSE_REASON_AISERVER_CONTROLLED_SHUTDOWN = 6;
}

enum PushResult {
    PUSH_RESULT_UNSPECIFIED = 0;
    PUSH_RESULT_ACCEPTED = 1;
    PUSH_RESULT_DUPLICATE = 2;
    PUSH_RESULT_REJECTED_CAPACITY = 3;
    PUSH_RESULT_REJECTED_INVALID = 4;
    reserved 5;
    reserved "PUSH_RESULT_REJECTED_IDENTITY";
    PUSH_RESULT_REJECTED_CONFLICT = 6;
    PUSH_RESULT_REJECTED_FINALIZED = 7;
}

enum PressureState {
    PRESSURE_STATE_UNSPECIFIED = 0;
    PRESSURE_STATE_NORMAL = 1;
    PRESSURE_STATE_HIGH = 2;
    PRESSURE_STATE_FULL = 3;
}

enum GetBatchResult {
    GET_BATCH_RESULT_UNSPECIFIED = 0;
    GET_BATCH_RESULT_LEASED = 1;
    GET_BATCH_RESULT_TIMEOUT = 2;
    GET_BATCH_RESULT_BUSY = 3;
    GET_BATCH_RESULT_REJECTED = 4;
}

enum DeliveryResult {
    DELIVERY_RESULT_UNSPECIFIED = 0;
    DELIVERY_RESULT_APPLIED = 1;
    DELIVERY_RESULT_ALREADY_APPLIED = 2;
    DELIVERY_RESULT_EXPIRED = 3;
    DELIVERY_RESULT_NOT_FOUND = 4;
    DELIVERY_RESULT_REJECTED = 5;
}

enum AckDisposition {
    ACK_DISPOSITION_UNSPECIFIED = 0;
    ACK_DISPOSITION_TRAINED = 1;
    reserved 2;
    reserved "ACK_DISPOSITION_STALE";
    ACK_DISPOSITION_INVALID = 3;
    ACK_DISPOSITION_SHUTDOWN_UNTRAINED = 4;
}

enum AIServerState {
    AISERVER_STATE_UNSPECIFIED = 0;
    AISERVER_STATE_STARTING = 1;
    AISERVER_STATE_READY = 2;
    AISERVER_STATE_DEGRADED = 3;
    AISERVER_STATE_DRAINING = 4;
    AISERVER_STATE_STOPPED = 5;
}

enum ModelState {
    MODEL_STATE_UNSPECIFIED = 0;
    MODEL_STATE_WAITING = 1;
    MODEL_STATE_READY = 2;
    MODEL_STATE_FAILED = 3;
}

enum ModelRegisterResult {
    MODEL_REGISTER_RESULT_UNSPECIFIED = 0;
    MODEL_REGISTER_RESULT_REGISTERED = 1;
    MODEL_REGISTER_RESULT_ALREADY_REGISTERED = 2;
    MODEL_REGISTER_RESULT_REJECTED_INVALID = 3;
    MODEL_REGISTER_RESULT_REJECTED_CONFLICT = 4;
}

enum ModelLoadStatus {
    MODEL_LOAD_STATUS_UNSPECIFIED = 0;
    MODEL_LOAD_STATUS_LOADED = 1;
    MODEL_LOAD_STATUS_FAILED = 2;
}

enum ModelAckResult {
    MODEL_ACK_RESULT_UNSPECIFIED = 0;
    MODEL_ACK_RESULT_APPLIED = 1;
    MODEL_ACK_RESULT_ALREADY_APPLIED = 2;
    MODEL_ACK_RESULT_NOT_FOUND = 3;
    MODEL_ACK_RESULT_REJECTED = 4;
}

enum ModelLookupResult {
    MODEL_LOOKUP_RESULT_UNSPECIFIED = 0;
    MODEL_LOOKUP_RESULT_FOUND = 1;
    MODEL_LOOKUP_RESULT_NOT_FOUND = 2;
    reserved 3;
    reserved "MODEL_LOOKUP_RESULT_REJECTED_IDENTITY";
}

enum SampleBackendType {
    SAMPLE_BACKEND_TYPE_UNSPECIFIED = 0;
    SAMPLE_BACKEND_TYPE_LOCAL_MEMORY = 1;
}

enum SamplePoolFinalizeResult {
    SAMPLE_POOL_FINALIZE_RESULT_UNSPECIFIED = 0;
    SAMPLE_POOL_FINALIZE_RESULT_FINALIZED = 1;
    SAMPLE_POOL_FINALIZE_RESULT_ALREADY_FINALIZED = 2;
    SAMPLE_POOL_FINALIZE_RESULT_REJECTED_ACTIVE_LEASE = 3;
    reserved 4;
    reserved "SAMPLE_POOL_FINALIZE_RESULT_REJECTED_IDENTITY";
    SAMPLE_POOL_FINALIZE_RESULT_REJECTED_CONFLICT = 5;
}

// One immutable PPO item after AIServer has closed a pinned-model segment and
// computed unnormalised GAE/value targets. Segment and bootstrap mechanics are
// producer-internal facts; the Learner consumes only the final PPO values.
message ProcessedTransition {
    string item_id = 1;
    repeated float observation = 2;
    int32 action = 3;
    float behavior_log_probability = 4;
    float behavior_value = 5;
    float advantage = 6;
    float value_target = 7;
    // Explicit presence preserves bootstrap model step zero.
    optional uint64 behavior_model_step = 8;
    int64 created_at_unix_ms = 9;
    // Task-defined action availability captured at behavior inference time.
    // Empty means action masking is disabled for this producer/consumer path.
    repeated bool action_mask = 10;
}

// Transport envelope for one immutable set of PPO items. The Pool owns only
// object identity and delivery lifecycle; it does not interpret task or model
// compatibility.
message ProcessedTransitionEnvelope {
    string envelope_id = 1;
    reserved 2, 4;
    reserved "payload_digest", "training_contract_digest";
    rl.common.v1.ServiceInstanceIdentity producer = 3;
    ModelIdentity behavior_model = 5;
    repeated ProcessedTransition samples = 6;
}

// Pool-owned facts attached to a leased transition. insert_sequence and
// inserted_at_unix_ms are raw storage facts; draw_count is never corrected or
// inferred by the consumer.
message SamplePoolItem {
    ProcessedTransition transition = 1;
    uint64 insert_sequence = 2;
    int64 inserted_at_unix_ms = 3;
    uint32 draw_count = 4;
}

message PushSamplesReq {
    reserved 1;
    reserved "credit_id";
    ProcessedTransitionEnvelope envelope = 2;
}

message PushSamplesRsp {
    PushResult result = 1;
    string message = 2;
    string envelope_id = 3;
    PressureState pressure_state = 4;
    rl.common.v1.ServiceInstanceIdentity sample_pool = 5;
    reserved 6;
    reserved "payload_digest";
}

message GetBatchReq {
    int32 requested_transitions = 1;
    int32 timeout_ms = 2;
    rl.common.v1.ServiceInstanceIdentity consumer = 3;
    int32 lease_timeout_ms = 4;
    reserved 5;
    reserved "required_training_contract_digest";
}

message GetBatchRsp {
    GetBatchResult result = 1;
    string message = 2;
    string delivery_id = 3;
    int64 lease_deadline_unix_ms = 4;
    repeated SamplePoolItem items = 5;
    rl.common.v1.ServiceInstanceIdentity sample_pool = 6;
}

message AckBatchReq {
    rl.common.v1.ServiceInstanceIdentity consumer = 1;
    string delivery_id = 2;
    AckDisposition disposition = 3;
    string train_update_id = 4;
}

message NackBatchReq {
    rl.common.v1.ServiceInstanceIdentity consumer = 1;
    string delivery_id = 2;
    string reason = 3;
}

message RenewLeaseReq {
    rl.common.v1.ServiceInstanceIdentity consumer = 1;
    string delivery_id = 2;
    int32 lease_timeout_ms = 3;
}

message DeliveryRsp {
    DeliveryResult result = 1;
    string message = 2;
    string delivery_id = 3;
    int64 lease_deadline_unix_ms = 4;
    AckDisposition disposition = 5;
    string train_update_id = 6;
}

message FinalizeSamplePoolReq {
    rl.common.v1.ServiceInstanceIdentity consumer = 1;
    rl.common.v1.ServiceInstanceIdentity expected_sample_pool = 2;
    string finalization_id = 3;
}

message FinalizeSamplePoolRsp {
    SamplePoolFinalizeResult result = 1;
    string message = 2;
    string finalization_id = 3;
    rl.common.v1.ServiceInstanceIdentity sample_pool = 4;
    optional int64 finalized_at_unix_ms = 5;
}

message SamplePoolStatusReq {}

message SamplePoolStatusRsp {
    reserved "behavior_versions", "minimum_ready_model_version", "maximum_ready_model_version";
    reserved 1;
    reserved "contract";
    rl.common.v1.ServiceInstanceIdentity sample_pool = 2;
    bool ready = 3;
    int64 push_attempt_count = 4;
    int64 accepted_unique_transitions = 5;
    int64 accepted_unique_envelopes = 6;
    int64 duplicate_push_attempt_count = 7;
    int64 duplicate_transition_attempts = 8;
    int64 rejected_push_attempt_count = 9;
    int64 rejected_transition_attempts = 10;
    int64 acked_unique_transitions = 11;
    int64 acked_unique_deliveries = 12;
    int64 ready_transitions = 13;
    reserved 14;
    reserved "ready_queue_fragments";
    int64 leased_transitions = 15;
    reserved 16;
    reserved "leased_fragments";
    int64 resident_transitions = 17;
    int64 resident_envelopes = 18;
    int64 resident_estimated_bytes = 19;
    int64 capacity_transitions = 20;
    reserved 21;
    reserved "capacity_fragments";
    int64 capacity_bytes = 22;
    PressureState pressure_state = 23;
    int64 redelivery_count = 24;
    int64 nack_count = 25;
    int64 expired_lease_count = 26;
    optional int64 latest_ack_at_unix_ms = 27;
    int64 target_hit_count = 28;
    int64 partial_get_count = 29;
    int64 empty_timeout_count = 30;
    string last_error = 31;
    reserved 32, 34;
    reserved "behavior_steps", "stale_sample_count";
    int64 trained_transition_count = 33;
    int64 invalid_transition_count = 35;
    int64 shutdown_untrained_transition_count = 36;
    int64 lease_renew_count = 37;
    SampleBackendType backend_type = 38;
    int32 max_concurrent_consumers = 39;
    int32 active_consumer_count = 40;
    int64 consumer_busy_count = 41;
    bool ingress_ready = 42;
    bool pool_ready = 43;
    int64 timestamp_unix_ms = 44;
    optional int64 oldest_ready_transition_age_ms = 45;
    optional uint64 minimum_ready_model_step = 46;
    optional uint64 maximum_ready_model_step = 47;
    reserved 48 to 65;
    reserved "active_demand_count", "active_demand_epoch",
             "active_demand_age_ms", "reserved_samples",
             "reserved_fragments", "reserved_estimated_bytes",
             "credit_request_count", "credit_grant_count",
             "credit_commit_count", "credit_release_count",
             "credit_expire_count", "credit_revoke_count",
             "credit_wait_no_demand_count",
             "credit_wait_inflight_limit_count",
             "credit_wait_capacity_count", "credit_wait_draining_count",
             "demand_upsert_count", "demand_release_count";
    int64 evicted_transition_count = 66;
    int64 evicted_envelope_count = 67;
    bool finalized = 68;
    string finalization_id = 69;
    optional int64 finalized_at_unix_ms = 70;
    int64 finalized_transition_count = 71;
    reserved 72;
    reserved "finalized_fragment_count";
    int64 draw_attempt_count = 73;
    int64 drawn_transition_slot_count = 74;
    int64 unsampled_evicted_transition_count = 75;
    int64 previously_drawn_evicted_transition_count = 76;
}

message AIServerStatusReq {}

// Independent of loaded_model readiness: an active model can remain valid
// while a newer candidate fails to download or prepare. This is an observed
// result, not a request to switch models or substitute another artifact.
message ModelFeedbackStatus {
    ModelIdentity candidate_model = 1;
    string stage = 2;
    string last_error = 3;
}

message AIServerStatusRsp {
    reserved 1, 34;
    reserved "contract", "rollout_estimator_profile_digest";
    rl.common.v1.ServiceInstanceIdentity aiserver = 2;
    AIServerState state = 3;
    bool ready = 4;
    bool distributor_ready = 5;
    ModelState model_state = 6;
    ModelIdentity loaded_model = 7;
    ModelIdentity staged_model = 8;
    int64 outbound_queue_envelopes = 9;
    int64 outbound_queue_transitions = 10;
    int64 outbound_queue_estimated_bytes = 11;
    int64 outbound_queue_high_watermark = 12;
    int64 produced_unique_transitions = 13;
    int64 produced_unique_envelopes = 14;
    int64 push_attempt_count = 15;
    int64 accepted_unique_transitions = 16;
    int64 duplicate_push_attempt_count = 17;
    int64 rejected_push_attempt_count = 18;
    int64 retry_attempt_count = 19;
    int64 final_drop_unique_transitions = 20;
    int64 active_actor_session_count = 21;
    int64 active_segment_count = 22;
    int64 inference_count = 23;
    double inference_latency_sum_ms = 24;
    double inference_latency_max_ms = 25;
    int64 push_rpc_count = 26;
    double push_rpc_latency_sum_ms = 27;
    double push_rpc_latency_max_ms = 28;
    int64 model_switch_count = 29;
    int64 quarantined_transition_count = 30;
    int64 quarantined_envelope_count = 31;
    string last_error = 32;
    int64 timestamp_unix_ms = 33;
    int64 closed_segment_count = 35;
    int64 pending_action_excluded_count = 36;
    int64 rollout_estimator_failure_count = 37;
    int64 per_agent_model_activation_count = 38;
    int64 superseded_without_agent_activation_count = 39;
    repeated SegmentCloseCount segment_close_counts = 40;
    ModelFeedbackStatus model_feedback = 41;
    int64 update_rpc_count = 42;
    double update_rpc_latency_sum_ms = 43;
    double update_rpc_latency_max_ms = 44;
    reserved "credit_request_count", "credit_grant_count",
             "credit_wait_count", "credit_reacquire_count",
             "producer_stale_count", "capacity_wait_ms",
             "training_capacity_wait";
}

message SegmentCloseCount {
    SegmentCloseReason reason = 1;
    int64 count = 2;
}

message ModelArtifactManifest {
    reserved 1, 2, 4 to 12, 14, 15, 17, 18, 20, 21;
    reserved "manifest_schema_version", "contract", "observation_schema",
             "action_schema", "model_architecture_id", "tensor_dtype",
             "input_shape", "action_shape", "value_shape", "artifact_uri",
             "model_file", "seed", "train_updates", "ready",
             "training_config_digest", "training_contract_digest",
             "rollout_estimator_profile";
    ModelIdentity identity = 3;
    int64 size_bytes = 13;
    uint64 trained_samples = 16;
    int64 published_at_unix_ms = 19;
}

message RegisterModelReq {
    ModelArtifactManifest manifest = 1;
    reserved 2;
    reserved "contract";
    // Registration-only local input. It is never persisted in or forwarded
    // with the public model manifest.
    string local_artifact_path = 3;
}

message RegisterModelRsp {
    ModelRegisterResult result = 1;
    string message = 2;
    ModelArtifactManifest manifest = 3;
    rl.common.v1.ServiceInstanceIdentity distributor = 4;
}

message GetModelManifestReq {
    ModelIdentity requested_model = 1;
    rl.common.v1.ServiceInstanceIdentity requester = 2;
    bool latest_in_lineage = 3;
}

message GetModelManifestRsp {
    ModelLookupResult result = 1;
    string message = 2;
    ModelArtifactManifest manifest = 3;
    rl.common.v1.ServiceInstanceIdentity distributor = 4;
    // On a successful response with a manifest, both values are always valid
    // for manifest.identity lineage. The inclusive range is contiguous and
    // model step zero is valid; zero must not be interpreted as no-data.
    optional uint64 available_floor_model_step = 5;
    optional uint64 latest_available_model_step = 6;
}

message DownloadModelReq {
    ModelIdentity requested_model = 1;
    rl.common.v1.ServiceInstanceIdentity requester = 2;
}

message ModelChunk {
    ModelIdentity model = 1;
    int64 offset = 2;
    bytes data = 3;
}

message AckModelReq {
    rl.common.v1.ServiceInstanceIdentity aiserver = 1;
    ModelIdentity model = 2;
    string load_instance_id = 3;
    ModelLoadStatus load_status = 4;
    string message = 5;
}

message AckModelRsp {
    ModelAckResult result = 1;
    string message = 2;
    rl.common.v1.ServiceInstanceIdentity distributor = 3;
}

message ModelDistributorStatusReq {}

message ModelDistributorStatusRsp {
    reserved "available_floor_model_version", "latest_available_model_version";
    reserved 1;
    reserved "contract";
    rl.common.v1.ServiceInstanceIdentity distributor = 2;
    bool ready = 3;
    int64 registered_model_count = 4;
    ModelIdentity latest_model = 5;
    int64 register_attempt_count = 6;
    int64 duplicate_register_count = 7;
    int64 rejected_register_count = 8;
    int64 download_request_count = 9;
    int64 download_success_count = 10;
    int64 download_failure_count = 11;
    int64 bytes_served = 12;
    int64 loaded_ack_count = 13;
    int64 failed_ack_count = 14;
    rl.common.v1.ServiceInstanceIdentity latest_ack_aiserver = 15;
    ModelIdentity latest_ack_model = 16;
    ModelLoadStatus latest_ack_status = 17;
    string last_error = 18;
    int64 timestamp_unix_ms = 19;
    // Valid only when latest_model has an identity. The inclusive range is for
    // that lineage, and model step zero is a valid floor/latest value.
    optional uint64 available_floor_model_step = 20;
    optional uint64 latest_available_model_step = 21;
}

service AIServerTrainingStatusService {
    rpc GetAIServerStatus(AIServerStatusReq) returns (AIServerStatusRsp);
}

// Learner-owned committed status; independent of a dashboard collector.
message LearnerStatusReq {}

message LearnerStatusRsp {
  rl.common.v1.ServiceInstanceIdentity learner = 1;
  int64 timestamp_unix_ms = 2;
  ModelIdentity model = 3;
  uint64 model_step = 4;
  uint64 train_updates = 5;
  uint64 trained_samples = 6;
  uint64 run_train_updates = 7;
  uint64 run_trained_samples = 8;
  uint64 initial_model_step = 9;
  uint64 train_batch_size = 10;
  optional uint64 actual_batch_size = 11;
  optional uint64 requested_train_batch_size = 12;
  optional uint64 pool_draw_slot_count = 13;
  optional uint64 unique_item_count = 14;
  optional uint64 duplicate_item_slot_count = 15;
  optional uint64 sample_evaluation_count = 16;
  optional uint64 optimizer_step_count = 17;
  optional double max_importance_ratio = 18;
  optional double explained_variance = 19;
  string disposition = 20;
  string last_error = 21;
  string train_update_id = 22;
}

service LearnerStatusService {
  rpc GetLearnerStatus(LearnerStatusReq) returns (LearnerStatusRsp);
}

service SamplePoolIngressService {
    rpc PushSamples(PushSamplesReq) returns (PushSamplesRsp);
    rpc GetStatus(SamplePoolStatusReq) returns (SamplePoolStatusRsp);
}

service SamplePoolConsumerService {
    rpc GetBatch(GetBatchReq) returns (GetBatchRsp);
    rpc AckBatch(AckBatchReq) returns (DeliveryRsp);
    rpc NackBatch(NackBatchReq) returns (DeliveryRsp);
    rpc RenewLease(RenewLeaseReq) returns (DeliveryRsp);
    rpc FinalizeSamplePool(FinalizeSamplePoolReq)
        returns (FinalizeSamplePoolRsp);
    rpc GetStatus(SamplePoolStatusReq) returns (SamplePoolStatusRsp);
}

service ModelDistributorService {
    rpc RegisterModel(RegisterModelReq) returns (RegisterModelRsp);
    rpc GetModelManifest(GetModelManifestReq) returns (GetModelManifestRsp);
    rpc DownloadModel(DownloadModelReq) returns (stream ModelChunk);
    rpc AckModel(AckModelReq) returns (AckModelRsp);
    rpc GetModelDistributorStatus(ModelDistributorStatusReq)
        returns (ModelDistributorStatusRsp);
}
